name: Build APK Automatically

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build App and Package APK
        run: |
          PKG_FILE=$(find . -maxdepth 3 -name "package.json" | head -n 1)
          if [ -n "$PKG_FILE" ]; then
            APP_DIR=$(dirname "$PKG_FILE")
            echo "Found package.json in $APP_DIR"
            cd "$APP_DIR"
            npm install
            npm run build
            WEB_DIR="dist"
            if [ -d "build" ]; then WEB_DIR="build"; fi
            if [ -d "out" ]; then WEB_DIR="out"; fi
          else
            HTML_FILE=$(find . -maxdepth 3 -name "index.html" | head -n 1)
            APP_DIR=$(dirname "$HTML_FILE")
            echo "Found static index.html in $APP_DIR"
            cd "$APP_DIR"
            mkdir -p www
            cp -r * www/ 2>/dev/null || true
            npm init -y
            WEB_DIR="www"
          fi

          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "OpenTouch" "com.opentouch.app" --web-dir="$WEB_DIR"
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: output/app-debug.apk
